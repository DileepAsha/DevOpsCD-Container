apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: 194774917398.dkr.ecr.ap-south-2.amazonaws.com/test1:latest
          ports:
            - containerPort: 80
